<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexSport - Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="shop-page">

    <div class="card-container dashboard-container">
        <h2>NexSport</h2>
        <p class="hint" id="welcome"></p>


        <h3 class="section-title">Products</h3>
           <div class="form-group">
       <label for="productSearch">Search products</label>
       <input type="search" id="productSearch" placeholder="Search by name or category...">
   </div>
        <div id="productList"></div>

        <h3 class="section-title">My orders</h3>
        <div id="orderList"></div>

        <div class="form-group payment-box">
            <label for="paymentMethod">Pay with</label>
            <select id="paymentMethod"></select>
        </div>
        <a class="back-link" href="index.html" id="logoutLink">Log out</a>
        <footer class="site-footer">&copy; 2026 NEXSPORT. All rights reserved.</footer>
    </div>

    <script src="app.js"></script>
    <script src="shop.js"></script>
</body>
</html>
